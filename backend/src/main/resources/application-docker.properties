# Perfil Docker: la BD ya trae schema + seeds desde el contenedor postgres (initdb).
# "create"/"create-drop" borrarían los datos cargados desde database/*.sql cada arranque.
spring.jpa.hibernate.ddl-auto=none

# Secreto JWT obligatorio desde el entorno (sin valor por defecto):
# si JWT_SECRET no está definido, la aplicación NO arranca.
jwt.secret=${JWT_SECRET}
