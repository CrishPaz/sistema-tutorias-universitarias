# =====================================================
# CONFIGURACIÓN SPRING BOOT - SISTEMA TUTORÍAS PREMIUM
# =====================================================

server.port=8080
server.servlet.context-path=/api

# =====================================================
# SPRING PROFILE
# =====================================================
spring.profiles.active=dev

# =====================================================
# DATABASE - SUPABASE / POSTGRESQL
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tutorias_universitarias
spring.datasource.username=tutorias_user
spring.datasource.password=TutoriasSecure2026!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =====================================================
# JWT CONFIGURATION (Premium Security)
# =====================================================
# Secreto JWT. En dev usa el fallback (INSEGURO, solo local). En docker/prod
# proviene exclusivamente de la variable de entorno JWT_SECRET (ver application-docker.properties).
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# =====================================================
# SUPABASE INTEGRATION (Opcional - Storage, Auth)
# =====================================================
supabase.url=https://your-project.supabase.co
supabase.anon-key=your-anon-key-here
supabase.service-role-key=your-service-role-key

# =====================================================
# OPENAPI / SWAGGER
# =====================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =====================================================
# ACTUATOR (Health & Metrics)
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =====================================================
# LOGGING
# =====================================================
logging.level.com.tutorias=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =====================================================
# CACHE (Redis ready)
# =====================================================
spring.cache.type=simple

# =====================================================
# CORS (Para Next.js Frontend)
# =====================================================
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://tutorias.universidad.edu
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true